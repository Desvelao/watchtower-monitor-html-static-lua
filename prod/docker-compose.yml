services:
  worker:
    image: ghcr.io/desvelao/watchtower-monitor-html-static-lua:0.1.0-alpha2
    container_name: watchtower-observer-web-scraper
    volumes:
      # Overrides the image's own baked-in default config (see
      # docker/images/prod/worker_config.default.lua) - copy
      # worker_config/worker_config.example.lua to worker_config/worker_config.lua
      # and edit it first (see prod/README.md).
      - ./worker_config/worker_config.lua:/app/worker_config.default.lua:ro
      # Where ndjson_output (if configured) writes observations.
      - ./data:/data
    environment:
      # A real API key created via POST /api/auth/api_key on the target
      # watchtower-server, for a user/role with this worker's needed
      # permissions - see watchtower-server's docs/dev/worker-configuration.md.
      # SERVER_API_KEY_FILE (a Docker secret) is also supported instead.
      SERVER_API_KEY: ${SERVER_API_KEY}
      WATCHTOWER_SERVER_ADDRESS: ${WATCHTOWER_SERVER_ADDRESS:-http://server:8080}
